<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업 지도안 초안 생성기</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #68738a;
      --line: #e1e6f0;
      --primary: #5a55d6;
      --primary-dark: #4641bc;
      --soft: #eeedff;
      --danger: #c94242;
      --shadow: 0 18px 50px rgba(38, 45, 75, 0.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: var(--bg);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
    }
    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 58px 0 34px; }
    .eyebrow { color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 10px; font-size: clamp(30px, 5vw, 48px); line-height: 1.15; letter-spacing: -.045em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 16px; }
    .layout { display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; padding-bottom: 48px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .form-card { padding: 24px; position: sticky; top: 18px; }
    .result-card { min-height: 650px; overflow: hidden; }
    .card-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .pill { background: var(--soft); color: var(--primary-dark); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    label { display: block; margin: 17px 0 7px; font-size: 13px; font-weight: 800; }
    input, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 11px; background: #fbfcff;
      padding: 12px 13px; color: var(--ink); font: inherit; outline: none; transition: .18s;
    }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(90, 85, 214, .11); background: #fff; }
    textarea { min-height: 145px; resize: vertical; }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .button-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-top: 22px; }
    button { border: 0; border-radius: 11px; padding: 12px 16px; font: inherit; font-weight: 800; cursor: pointer; transition: transform .18s, background .18s, opacity .18s; }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: wait; transform: none; }
    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #f1f3f8; color: var(--ink); }
    .status { min-height: 20px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; }
    .status.error { color: var(--danger); }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 22px 26px; border-bottom: 1px solid var(--line); }
    .result-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .download { padding: 9px 12px; color: var(--primary-dark); background: var(--soft); font-size: 12px; white-space: nowrap; }
    .report { padding: 28px 32px 35px; }
    .empty { display: grid; place-items: center; min-height: 530px; padding: 30px; text-align: center; color: var(--muted); }
    .empty-icon { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; background: var(--soft); color: var(--primary); font-size: 24px; }
    .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 5px; }
    .report-meta { padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .report-meta h3 { margin: 0 0 5px; font-size: 22px; letter-spacing: -.035em; }
    .report-meta p { margin: 0; color: var(--muted); font-size: 13px; }
    .section { margin: 0 0 26px; }
    .section h4 { display: flex; align-items: center; gap: 9px; margin: 0 0 9px; color: var(--primary-dark); font-size: 16px; }
    .num { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--soft); font-size: 12px; }
    .section p { margin: 0; white-space: pre-wrap; color: #3e475b; font-size: 14px; }
    footer { padding: 0 0 30px; color: #8a92a2; text-align: center; font-size: 12px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .form-card { position: static; } .result-card { min-height: 0; } .result-head { padding: 19px; } .report { padding: 24px 20px; } }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="eyebrow">Lesson plan studio</div>
    <h1>수업 지도안 초안 생성기</h1>
    <p class="subtitle">학년·과목·성취기준을 바탕으로 5단계 수업 흐름을 빠르게 설계해 보세요.</p>
  </header>

  <main class="wrap layout">
    <section class="card form-card">
      <div class="card-title"><h2>수업 정보 입력</h2><span class="pill">Gemini API</span></div>
      <label for="apiKey">Gemini API 키</label>
      <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" />
      <p class="hint">키는 이 브라우저에서만 사용되며 저장하지 않습니다.</p>

      <label for="model">API 모델</label>
      <input id="model" value="Gemini 3.5 Flash-Lite" readonly />

      <label for="grade">학년</label>
      <input id="grade" placeholder="예: 초등 4학년, 중1" />

      <label for="subject">과목</label>
      <input id="subject" placeholder="예: 과학, 국어, 사회" />

      <label for="standard">성취기준 또는 수업 주제</label>
      <textarea id="standard" placeholder="예: 물의 상태 변화를 관찰하고, 생활 속에서 활용되는 사례를 설명할 수 있다."></textarea>
      <div class="button-row">
        <button id="generateBtn" class="primary">지도안 생성하기</button>
        <button id="sampleBtn" class="secondary" type="button">예시 입력</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section class="card result-card">
      <div class="result-head">
        <div><h2>지도안 초안</h2><p>도입 · 전개 1 · 전개 2 · 전개 3 · 정리</p></div>
        <button id="downloadBtn" class="download" type="button" disabled>텍스트 다운로드</button>
      </div>
      <div id="report" class="report">
        <div class="empty"><div><div class="empty-icon">✦</div><strong>아직 생성된 지도안이 없습니다.</strong><span>왼쪽 정보를 입력하고 생성 버튼을 눌러 주세요.</span></div></div>
      </div>
    </section>
  </main>
  <footer class="wrap">수업의 맥락에 맞게 생성된 초안을 검토하고 수정해 사용하세요.</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    let latestText = '';
    const stages = ['도입', '전개 1', '전개 2', '전개 3', '정리'];

    function setStatus(message, error = false) {
      $('status').textContent = message;
      $('status').className = 'status' + (error ? ' error' : '');
    }
    function showReport(data) {
      const grade = $('grade').value.trim(), subject = $('subject').value.trim();
      const title = `${grade} ${subject} 수업 지도안 초안`;
      const intro = `학년: ${grade}  ·  과목: ${subject}`;
      $('report').innerHTML = `<div class="report-meta"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(intro)}</p></div>` +
        stages.map((stage, i) => `<article class="section"><h4><span class="num">${i + 1}</span>${stage}</h4><p>${escapeHtml(data[stage] || '내용을 생성하지 못했습니다.')}</p></article>`).join('');
      latestText = `${title}\n${intro}\n\n` + stages.map((stage, i) => `${i + 1}. ${stage}\n${data[stage] || ''}`).join('\n\n');
      $('downloadBtn').disabled = false;
    }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    async function generatePlan() {
      const apiKey = $('apiKey').value.trim(), grade = $('grade').value.trim(), subject = $('subject').value.trim(), standard = $('standard').value.trim();
      if (!apiKey || !grade || !subject || !standard) { setStatus('API 키, 학년, 과목, 성취기준을 모두 입력해 주세요.', true); return; }
      const button = $('generateBtn'); button.disabled = true; setStatus('Gemini가 수업 지도안을 작성하고 있습니다…');
      const prompt = `당신은 한국 학교 현장의 전문 수업 설계자입니다. 아래 정보를 바탕으로 실제 교사가 바로 다듬어 사용할 수 있는 수업 지도안 초안을 한국어로 작성하세요. 반드시 JSON 객체 하나만 반환하고, 마크다운 코드 펜스나 다른 설명은 포함하지 마세요. 키는 정확히 "도입", "전개 1", "전개 2", "전개 3", "정리" 5개입니다. 각 값은 3~5문장으로, 교사 활동·학생 활동·발문·자료 또는 유의점을 구체적으로 포함하세요.\n\n학년: ${grade}\n과목: ${subject}\n성취기준/주제: ${standard}`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] },)
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error?.message || 'API 요청에 실패했습니다.');
        const raw = body.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
        const clean = raw.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
        const data = JSON.parse(clean);
        showReport(data); setStatus('지도안 초안이 생성되었습니다. 내용을 검토해 사용하세요.');
      } catch (error) {
        setStatus(error.message.includes('JSON') ? '응답 형식을 읽지 못했습니다. 다시 시도해 주세요.' : error.message, true);
      } finally { button.disabled = false; }
    }
    $('generateBtn').addEventListener('click', generatePlan);
    $('sampleBtn').addEventListener('click', () => { $('grade').value = '초등 4학년'; $('subject').value = '과학'; $('standard').value = '물의 상태 변화를 관찰하고, 생활 속에서 활용되는 사례를 설명할 수 있다.'; setStatus('예시 입력을 채웠습니다.'); });
    $('downloadBtn').addEventListener('click', () => { const blob = new Blob([latestText], {type: 'text/plain;charset=utf-8'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = '수업-지도안-초안.txt'; a.click(); URL.revokeObjectURL(url); });
  </script>
</body>
</html>
